# ──────────────────────────────────────────────────────────────────────────────
# GridDB – Spring Boot backend configuration
# Values here can be overridden by environment variables (same name, upper-case,
# dots replaced by underscores).  e.g. MYSQL_HOST overrides mysql.host.
# ──────────────────────────────────────────────────────────────────────────────

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:3001}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.griddb=DEBUG

# ── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated allowed origins, or * to allow all (development only)
cors.origins=${CORS_ORIGINS:*}

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ── MySQL connection defaults ─────────────────────────────────────────────────
# These are used when the caller does NOT supply the field in the request body.
# Fill in real values here or set the corresponding environment variables.
mysql.host=${MYSQL_HOST:127.0.0.1}
mysql.port=${MYSQL_PORT:3306}
mysql.user=${MYSQL_USER:}
mysql.password=${MYSQL_PASSWORD:}
mysql.database=${MYSQL_DATABASE:}

# ── AI / Gemini ───────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
mysql.ssl=${MYSQL_SSL:false}
# Maximum rows to pull in one import (prevents OOM); caller can override up to 1 000 000
mysql.row-limit=${MYSQL_ROW_LIMIT:200000}

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
